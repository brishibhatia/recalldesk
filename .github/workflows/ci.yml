name: RecallDesk checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: recalldesk
          POSTGRES_PASSWORD: local_demo_only
          POSTGRES_DB: recalldesk
        ports: ["55432:5432"]
        options: --health-cmd="pg_isready -U recalldesk" --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      APP_MODE: demo
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://recalldesk:local_demo_only@localhost:55432/recalldesk
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run evaluate
      - run: npm run scan:secrets
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm start > /tmp/recalldesk-web.log 2>&1 &
      - run: npm run worker > /tmp/recalldesk-worker.log 2>&1 &
      - run: node scripts/wait-for-app.mjs
      - run: npm run test:e2e
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            artifacts/
            playwright-report/
            test-results/
