name: Publish project article
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/blog-draft.md", "scripts/build-blog.mjs", "artifacts/screenshots/desktop-case.png", "artifacts/demo/recalldesk-demo.webm", ".github/workflows/blog.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - run: node scripts/build-blog.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
